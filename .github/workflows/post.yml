name: LinkedIn Auto Post

on:
  workflow_dispatch:
    inputs:
      series:
        description: 'Which series to post? (agile_journey, data_agile, or agile_ai)'
        required: true
        default: 'agile_journey'
      dry_run:
        description: 'Dry run? (true = verify only, do NOT post to LinkedIn)'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv Pillow

      - name: Determine which series to post
        id: series
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "agent=${{ github.event.inputs.series }}" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then
            echo "agent=agile_journey" >> $GITHUB_OUTPUT
          else
            echo "agent=data_agile" >> $GITHUB_OUTPUT
          fi

      - name: Post Agile Journey (8 AM)
        if: steps.series.outputs.agent == 'agile_journey'
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python agent.py

      - name: Post Data-Driven Agile (12 PM)
        if: steps.series.outputs.agent == 'data_agile'
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python agent_data_agile.py

      - name: Post Agile Reimagined With AI (12 PM)
        if: steps.series.outputs.agent == 'agile_ai'
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python agent_agile_ai.py

      - name: Commit report back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_reports.json || true
          git diff --cached --quiet || git commit -m "Post report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
